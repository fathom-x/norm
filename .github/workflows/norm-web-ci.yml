# CI for norm in the browser: the opentui wasm core, the browser build
# (packages/web-tui) and its end-to-end test against a mock Overpay. owallet's
# wasm crate (owallet-web) is built and tested in owallet-ci.yml.
name: norm-web-ci

on:
  # Nightly: the staging smoke test (it skips itself unless configured).
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "packages/opentui-wasm/**"
      - "packages/web-tui/**"
      - "packages/tui/**"
      - "packages/core/**"
      - "packages/opencode/**"
      - "owallet/**"
      - ".github/workflows/norm-web-ci.yml"
  pull_request:
    paths:
      - "packages/opentui-wasm/**"
      - "packages/web-tui/**"
      - "packages/tui/**"
      - "packages/core/**"
      - "packages/opencode/**"
      - "owallet/**"
      - ".github/workflows/norm-web-ci.yml"
  workflow_dispatch:

concurrency:
  group: norm-web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opentui-wasm:
    name: opentui on a wasm core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Cache the opentui checkout, Zig and its packages
        uses: actions/cache@v4
        with:
          path: |
            packages/opentui-wasm/.work
            ~/.cache/zig
          key: opentui-wasm-${{ hashFiles('packages/opentui-wasm/UPSTREAM', 'packages/opentui-wasm/patches/**') }}

      - name: Build the wasm core and the patched packages
        run: bash packages/opentui-wasm/scripts/build.sh

      - name: Install Playwright's Chromium
        working-directory: packages/opentui-wasm/demo
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser checks (xterm.js + wasm core, core and Solid scenes)
        working-directory: packages/opentui-wasm
        run: npm test

      - name: norm's TUI suite on the wasm core
        run: bash packages/opentui-wasm/scripts/test-norm-tui.sh

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentui-wasm-screenshots
          path: packages/opentui-wasm/test/screenshots
          if-no-files-found: ignore

      # The web build imports the wasm core and the patched packages from here.
      - name: Publish the opentui wasm build
        uses: actions/upload-artifact@v4
        with:
          name: opentui-wasm-dist
          path: packages/opentui-wasm/dist
          if-no-files-found: error

  web-tui:
    name: norm in the browser (unit + headless Chromium)
    needs: opentui-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/web-tui
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@v4
        with:
          name: opentui-wasm-dist
          path: packages/opentui-wasm/dist

      # owallet-web: Rust → wasm32, C deps (secp256k1, SQLite) via clang.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owallet/crates/owallet-web
      - name: clang + llvm-ar
        run: command -v clang && command -v llvm-ar || { sudo apt-get update && sudo apt-get install -y clang llvm; }
      - name: wasm-bindgen-cli (the version in owallet-web's Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' ../../owallet/crates/owallet-web/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Build owallet-web into the page
        run: bun run build:owallet

      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright/index.js" >> "$GITHUB_ENV"
          echo "CHROME=$(node -e "console.log(require('$RUNNER_TEMP/pw/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (bun + happy-dom, browser conditions)
        run: bun run test

      - name: Build the page
        run: bun run build

      - name: Core in a worker (debug panel)
        run: node test/browser/smoke.mjs

      - name: The TUI (scripted owallet)
        run: node test/browser/tui.mjs

      - name: owallet-web against the mock Overpay
        run: node test/browser/owallet.mjs

      - name: End to end (setup screen → TUI → owallet-web → mock Overpay)
        run: node test/browser/e2e.mjs

      # As served from a sub-path (GitHub Pages: https://<owner>.github.io/<repo>/).
      - name: The TUI under a sub-path
        run: |
          NORM_WEB_BASE=/norm/ node_modules/.bin/vite build --outDir "$RUNNER_TEMP/dist-sub"
          DIST="$RUNNER_TEMP/dist-sub" BASE_PATH=/norm PORT=4321 node test/browser/tui.mjs

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-tui-screenshots
          path: packages/web-tui/test/screenshots
          if-no-files-found: ignore

  # The same end-to-end test against the real staging Overpay, nightly and on
  # demand. Configure both, or it skips itself:
  #   secret NORM_WEB_E2E_MNEMONIC — seed phrase of a wallet whose staging
  #     account holds core credits (each run spends a few cents);
  #   variable NORM_WEB_E2E_OVERPAY_URL — the staging rails URL, whose
  #     API_CORS_ORIGINS must include http://127.0.0.1:4320 (the test's page).
  staging-smoke:
    name: end to end against staging Overpay
    needs: opentui-wasm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_OVERPAY_URL: ${{ vars.NORM_WEB_E2E_OVERPAY_URL }}
      E2E_MNEMONIC: ${{ secrets.NORM_WEB_E2E_MNEMONIC }}
    defaults:
      run:
        working-directory: packages/web-tui
    steps:
      - name: Configured?
        id: configured
        working-directory: .
        run: |
          if [ -n "$E2E_OVERPAY_URL" ] && [ -n "$E2E_MNEMONIC" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::staging smoke test not configured (NORM_WEB_E2E_OVERPAY_URL / NORM_WEB_E2E_MNEMONIC); skipping"; fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.run == 'true'
      - uses: ./.github/actions/setup-bun
        if: steps.configured.outputs.run == 'true'
      - uses: actions/download-artifact@v4
        if: steps.configured.outputs.run == 'true'
        with:
          name: opentui-wasm-dist
          path: packages/opentui-wasm/dist
      - uses: dtolnay/rust-toolchain@stable
        if: steps.configured.outputs.run == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.configured.outputs.run == 'true'
        with:
          workspaces: owallet/crates/owallet-web
      - name: Toolchain, owallet-web, Playwright
        if: steps.configured.outputs.run == 'true'
        run: |
          command -v clang && command -v llvm-ar || { sudo apt-get update && sudo apt-get install -y clang llvm; }
          v=$(grep -A1 '^name = "wasm-bindgen"$' ../../owallet/crates/owallet-web/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
          bun run build:owallet
          bun run build
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright/index.js" >> "$GITHUB_ENV"
          echo "CHROME=$(node -e "console.log(require('$RUNNER_TEMP/pw/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: End to end against staging
        if: steps.configured.outputs.run == 'true'
        run: node test/browser/e2e.mjs
      - name: Screenshots
        if: always() && steps.configured.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-screenshots
          path: packages/web-tui/test/screenshots
          if-no-files-found: ignore
