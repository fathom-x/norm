# norm's own release pipeline: bare v* tags build the `norm` CLI for every
# supported platform and attach the archives to a GitHub release. owallet
# binaries have their own owallet-v* pipeline (owallet-release.yml); the
# remaining workflows in this directory are inherited from upstream opencode.
name: norm-release

on:
  push:
    tags: ["v*"]

concurrency: norm-release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    if: "!startsWith(github.ref_name, 'vscode-v')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "norm ${GITHUB_REF_NAME}" \
              --generate-notes

      - name: Build and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_RELEASE: "1"
          OPENCODE_CHANNEL: latest
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          ./packages/opencode/script/build.ts
