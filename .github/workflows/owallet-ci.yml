name: owallet ci

on:
  push:
    branches: [main]
    paths:
      - "owallet/**"
      - ".github/workflows/owallet-ci.yml"
  pull_request:
    paths:
      - "owallet/**"
      - ".github/workflows/owallet-ci.yml"

jobs:
  test:
    # Standard runner: Swatinem/rust-cache handles the warm-build case
    # (the common one) just fine. Cold builds — when Cargo.lock changes
    # — are slow either way; bumping to a larger runner via
    # `ubuntu-latest-8-cores` was tried but the org's larger-runner
    # provisioning made the job queue indefinitely without dispatching.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owallet
      - name: cargo fmt --check
        working-directory: owallet
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: owallet
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (dev-envs)
        working-directory: owallet
        run: cargo clippy -p owallet -p owallet-config --all-targets --features dev-envs -- -D warnings
      - name: cargo test
        working-directory: owallet
        run: cargo test --workspace --locked
      - name: cargo test (dev-envs)
        working-directory: owallet
        run: cargo test -p owallet -p owallet-config --features dev-envs --locked

  wasm:
    # owallet-web: the browser build. Its own workspace (see
    # owallet/crates/owallet-web/README.md), so it gets its own job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owallet/crates/owallet-web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owallet/crates/owallet-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clang + llvm-ar (C deps cross-compiled to wasm32)
        run: |
          command -v clang && command -v llvm-ar || {
            sudo apt-get update && sudo apt-get install -y clang llvm
          }
      - name: wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: true
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: cargo clippy (native)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo build (wasm32, release)
        run: cargo build --target wasm32-unknown-unknown --release --locked
      - name: native tests (router against the mock Overpay)
        run: cargo test --locked
      - name: browser tests (headless Chrome)
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/webdriver.json
          WASM_BINDGEN_TEST_TIMEOUT: "180"
        run: |
          cat > "$WASM_BINDGEN_TEST_WEBDRIVER_JSON" <<JSON
          {"goog:chromeOptions": {"binary": "${{ steps.chrome.outputs.chrome-path }}",
            "args": ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage"]}}
          JSON
          PORT=4010 MOCK_STREAM_POLLS=2 node tests/mock-overpay/server.mjs &
          cargo test --target wasm32-unknown-unknown --locked

  docker_build:
    # Verify the production image still builds. The Dockerfile uses
    # `COPY . /src` so the build context is the owallet workspace root.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build owallet image
        uses: docker/build-push-action@v7
        with:
          context: owallet
          file: owallet/Dockerfile
          push: false
          cache-from: type=gha,scope=owallet
          cache-to: type=gha,mode=max,scope=owallet
