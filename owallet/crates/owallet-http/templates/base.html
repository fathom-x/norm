<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>owallet — {% block title %}{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f5f5f5; color: #222; min-height: 100vh; padding: 20px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 32px;
            margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
    h1 { font-size: 1.5rem; margin-bottom: 14px; color: #111; }
    h2 { font-size: 1.1rem; margin: 16px 0 10px; color: #111; }
    p  { color: #555; line-height: 1.5; margin-bottom: 14px; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 6px; }
    input[type=text], input[type=password], select, textarea {
      width: 100%; padding: 10px 14px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 1rem; background: white;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #2563eb; outline: none;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }
    .field { margin-bottom: 14px; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    button, .button {
      padding: 10px 16px; border: none; border-radius: 8px;
      font-size: .95rem; font-weight: 500; cursor: pointer;
      background: #2563eb; color: white; text-decoration: none;
      display: inline-block; white-space: nowrap;
    }
    button:hover, .button:hover { opacity: .88; }
    .button.secondary { background: #f3f4f6; color: #374151; }
    .button.danger { background: #dc2626; }
    .notice { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: .9rem; }
    .notice.ok { background: #d1fae5; color: #065f46; }
    .notice.err { background: #fee2e2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px 6px; text-align: left; border-bottom: 1px solid #eee;
             font-size: .9rem; }
    /* Long unbroken values (npubs, addresses, key prefixes) may wrap
       anywhere; prose cells wrap at spaces like normal text. */
    td code { word-break: break-all; }
    /* Wide tables scroll inside their card instead of mangling cells. */
    .table-scroll { overflow-x: auto; }
    .table-scroll td, .table-scroll th { white-space: nowrap; }
    .table-scroll td code { word-break: normal; }
    /* Compact in-row form (the per-key budget editor). */
    .inline-edit { display: flex; gap: 4px; align-items: center; margin: 4px 0 0; }
    .inline-edit input[type=text] { width: 90px; padding: 6px 8px; font-size: .85rem; }
    .inline-edit button { padding: 6px 10px; font-size: .85rem; }
    code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace;
                font-size: .85rem; }
    pre { background: #f3f4f6; padding: 14px; border-radius: 8px;
          overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    a { color: #2563eb; }
    .muted { color: #9ca3af; }
    nav { margin-bottom: 16px; }
    nav a { margin-right: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
