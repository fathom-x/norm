name: owallet release

# Build static `owallet` binaries for the standard targets on every
# `owallet-v*` tag push and attach them to the GitHub release. The
# prefixed tag pattern keeps owallet releases distinct from releases of
# the opencode fork at the repo root.

on:
  push:
    tags:
      - "owallet-v*"
    # Cut a release without pushing a tag (remote sessions may only push
    # branches): `git push origin main:release/owallet-v0.1.0` — the release
    # job mints the tag itself, and the branch can be deleted afterwards.
    branches:
      - "release/owallet-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pre-release: only the targets the team actually runs — the
        # installer fetches x86_64-unknown-linux-musl for linux-x64 (static,
        # works on glibc too) and aarch64-apple-darwin for Apple Silicon.
        # Re-add the commented entries to restore the full matrix.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   cross: false
          #   archive: tar.gz
          # - target: aarch64-unknown-linux-musl
          #   os: ubuntu-latest
          #   cross: true
          #   archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
            archive: tar.gz
          # macos-13 (the last Intel runner image) is retired; build the
          # x86_64 slice on the arm64 runner via cargo's cross-target support.
          # - target: x86_64-apple-darwin
          #   os: macos-14
          #   cross: false
          #   archive: tar.gz
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   cross: false
          #   archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # Pre-public-release: build with `dev-envs` so the bundled binary has
      # the --dev/--staging selectors (and the baked-in staging Overpay URL)
      # that norm's staging-by-default bootstrap relies on. Drop the feature
      # flag from both build steps at the public release.
      - name: Build (cross)
        if: matrix.cross
        working-directory: owallet
        run: cross build --profile dist --target ${{ matrix.target }} -p owallet --features dev-envs

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        working-directory: owallet
        run: cargo build --profile dist --target ${{ matrix.target }} -p owallet --features dev-envs

      - name: Determine version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF##*/}"
          ver="${ref#owallet-v}"
          if [ -z "$ver" ] || [ "$ver" = "$ref" ]; then
            # workflow_dispatch — use a -dev tag
            ver="0.0.0-dev"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        working-directory: owallet
        run: |
          stage="owallet-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp "target/${{ matrix.target }}/dist/owallet" "dist/$stage/"
          cp README.md "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: owallet
        run: |
          $stage = "owallet-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/dist/owallet.exe" "dist/$stage/"
          Copy-Item "README.md" "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: owallet-${{ matrix.target }}
          path: owallet/dist/owallet-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/owallet-v') || startsWith(github.ref, 'refs/heads/release/owallet-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd dist
          sha256sum owallet-* > SHA256SUMS
      - name: Resolve tag
        id: tag
        run: |
          ref="${GITHUB_REF_NAME#release/}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/owallet-*.tar.gz
            dist/owallet-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
