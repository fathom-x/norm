[package]
name = "owallet-web"
# Keep in step with the owallet workspace version (owallet/Cargo.toml).
# `/health` reports owallet-mcp's version, so this one is informational.
version = "0.1.10"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/fathom-x/norm"
description = "owallet in the browser: the /v1, /mcp and /health routers plus a /_mgmt JSON API, compiled to wasm32-unknown-unknown and answered through a fetch-shaped handle(Request) -> Promise<Response>."
publish = false

# A workspace of its own — see README.md ("Why a separate workspace").
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
owallet-crypto = { path = "../owallet-crypto" }
owallet-db = { path = "../owallet-db" }
owallet-config = { path = "../owallet-config" }
owallet-overpay = { path = "../owallet-overpay" }
# No on-chain rails in the browser: no alloy, no librustzcash.
owallet-mcp = { path = "../owallet-mcp", default-features = false }

axum = { version = "0.8", default-features = false, features = ["json", "query"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Headers",
    "ReadableStream",
    "Request",
    "Response",
    "ResponseInit",
] }
wasm-streams = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# The SQLite backend rusqlite uses on wasm32-unknown-unknown, plus its
# OPFS (sync access handle pool) VFS for persistence.
sqlite-wasm-rs = { version = "=0.5.1", default-features = false }
sqlite-wasm-vfs = "=0.1.0"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "RequestInit",
] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
http-body-util = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
