[package]
name = "owallet-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted SQLite storage for owallet. Byte-compatible with the Python wallet_mcp.db schema."

[dependencies]
owallet-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { version = "=0.3.37", default-features = false, features = ["parsing"] }
time-tz = "2.0.0"
# `SystemTime` that works in the browser (re-exports `std::time` natively).
web-time = "1"

# rusqlite: one version range, two backends. Natively the workspace
# resolves 0.37 + bundled SQLite (zcash_client_sqlite pins it, and
# libsqlite3-sys `links = "sqlite3"` allows only one). The browser build
# (crates/owallet-web, its own workspace without the zcash stack) resolves
# 0.38, whose wasm32-unknown-unknown backend is sqlite-wasm-rs.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
rusqlite = { version = ">=0.37, <0.39", features = ["bundled"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
rusqlite = { version = ">=0.37, <0.39" }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
