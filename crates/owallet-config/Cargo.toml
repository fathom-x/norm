[package]
name = "owallet-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Environment / dotenv configuration loader for owallet. Replicates the `.owallet` file semantics from wallet_mcp/cli.py."

[features]
# Internal-only: exposes the `dev` / `staging` built-in environments (and
# their non-public URLs/ports). Off in public release builds so the shipped
# binary neither advertises nor embeds internal-environment information.
dev-envs = []

[dependencies]
dotenvy = "0.15"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
