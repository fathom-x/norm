[package]
name = "owallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "owallet command-line interface — Overpay wallet CLI (Rust port of wallet_mcp/cli.py)."

[[bin]]
name = "owallet"
path = "src/main.rs"

[dependencies]
owallet-crypto = { workspace = true }
owallet-db = { workspace = true }
owallet-config = { workspace = true }
owallet-overpay = { workspace = true }
owallet-evm = { workspace = true }
owallet-http = { workspace = true }

axum = "0.8"
open = "5"
url = "2"
serde = { workspace = true }
serde_urlencoded = "0.7"
toml_edit = "0.22"
dirs = "5"

clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serial_test = "3"
