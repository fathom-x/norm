# norm's own release pipeline: bare v* tags build the `norm` CLI for every
# supported platform and attach the archives to a GitHub release. owallet
# binaries have their own owallet-v* pipeline (owallet-release.yml); the
# remaining workflows in this directory are inherited from upstream opencode.
name: norm-release

on:
  push:
    tags: ["v*"]
    # Cut a release without pushing a tag (remote sessions may only push
    # branches): `git push origin main:release/v0.1.0` — the run creates
    # tag + release at that SHA via `gh release create`, and the branch
    # can be deleted afterwards.
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 — tag becomes v0.1.0)"
        required: true

concurrency: norm-release-${{ github.ref }}-${{ inputs.version || '' }}

permissions:
  contents: write

jobs:
  release:
    if: "!startsWith(github.ref_name, 'vscode-v')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
            VERSION="${VERSION#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "v${VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "norm v${VERSION}" \
              --generate-notes

      - name: Build and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_RELEASE: "1"
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          # Pre-release: only the targets the team actually runs (the
          # installer's darwin-arm64 and glibc linux-x64 assets). Drop
          # this line to build the full matrix again.
          NORM_BUILD_TARGETS: "linux-x64,darwin-arm64"
        run: ./packages/opencode/script/build.ts
