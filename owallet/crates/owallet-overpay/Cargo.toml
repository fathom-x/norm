[package]
name = "owallet-overpay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "REST client for the Overpay Rails API + OAuth PKCE helper. Rust port of the HTTP surface in wallet_mcp/server.py."

[dependencies]
owallet-crypto = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
thiserror = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
rand = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
# ActionCable subscriber for the marketplace's payment_status channel
# (crate::cable). native-roots so SSL_CERT_FILE-style overrides work the
# same way they do for reqwest.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
