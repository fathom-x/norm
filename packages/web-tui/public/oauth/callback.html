<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Connecting to Overpay</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #e8e8e8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 0 16px; }
    </style>
  </head>
  <body>
    <p id="msg">Finishing the Overpay connection…</p>
    <script>
      // Overpay's PKCE redirect lands here (an OAUTH_ALLOWED_REDIRECT_URIS
      // entry). Hand the code to the norm page that started the login over a
      // BroadcastChannel — same origin only, and without window.opener: the
      // popup is opened with noopener so the Overpay page never gets a handle
      // on the norm tab. owallet-web exchanges the code for the token; the
      // page also checks `state`.
      const params = new URLSearchParams(location.search)
      const channel = new BroadcastChannel("norm-overpay-oauth")
      channel.postMessage({
        type: "overpay-oauth",
        code: params.get("code"),
        state: params.get("state"),
        error: params.get("error"),
      })
      channel.close()
      // Keep the code out of history and the address bar.
      history.replaceState(null, "", location.pathname)
      document.getElementById("msg").textContent = "Connected. You can close this window."
      setTimeout(() => window.close(), 300)
    </script>
  </body>
</html>
