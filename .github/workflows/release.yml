name: release

# Build static `owallet` binaries for the standard targets on every `v*`
# tag push and attach them to the GitHub release. Replaces the conda +
# constructor pipeline from the Python install (no Python runtime
# bundled — just one statically linked binary per target).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --profile dist --target ${{ matrix.target }} -p owallet

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --profile dist --target ${{ matrix.target }} -p owallet

      - name: Determine version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF##*/}"
          ver="${ref#v}"
          if [ -z "$ver" ] || [ "$ver" = "$ref" ]; then
            # workflow_dispatch — use a -dev tag
            ver="0.0.0-dev"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          stage="owallet-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp "target/${{ matrix.target }}/dist/owallet" "dist/$stage/"
          cp README.md "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "owallet-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/dist/owallet.exe" "dist/$stage/"
          Copy-Item "README.md" "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: owallet-${{ matrix.target }}
          path: dist/owallet-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd dist
          sha256sum owallet-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/owallet-*.tar.gz
            dist/owallet-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
